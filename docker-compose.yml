services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cyber
      POSTGRES_PASSWORD: cyber-local
      POSTGRES_DB: cyberescape
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyber -d cyberescape"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cyber:cyber-local@db:5432/cyberescape?schema=public
      DIRECT_URL: postgresql://cyber:cyber-local@db:5432/cyberescape?schema=public
      FLAG_SECRET: local-demo-flag-secret-change-before-production
      NEXTAUTH_SECRET: local-demo-session-secret-change-before-production
      NEXTAUTH_URL: http://localhost:3002
      NODE_ENV: development
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    command: >-
      sh -c "npx prisma migrate deploy && npm run db:seed &&
      npm run dev -- --hostname 0.0.0.0 --port 3000"

volumes:
  postgres_data:
  app_node_modules:
  app_next:
